#cloud-config

# 更新package metadata和安裝基本包
package_update: true

packages:
  - curl
  - ca-certificates

# 寫創建文件和寫入content
write_files:


  # 安裝前,先將配置寫在/var/tmp
  - path: /var/tmp/salt-bootstrap.conf
    owner: root:root
    permissions: "0644"
    content: |
      ${salt_config}

  # 先將salt_states(是Base64編碼後字符) 進行Base64解碼再寫入到tar.gz(二進制)
  - path: /var/tmp/salt-states.tar.gz
    owner: root:root
    permissions: "0644"
    encoding: b64
    content: |
      ${salt_states}

# 執行Salt安裝和配置
runcmd:

  - |
      set -Eeuo pipefail

      echo "===下載官方 bootstrap-salt.sh==="

      curl --fail --silent --show-error --location \
        --output /var/tmp/bootstrap-salt.sh \
        https://github.com/saltstack/salt-bootstrap/releases/latest/download/bootstrap-salt.sh

      chmod 0755 /var/tmp/bootstrap-salt.sh

      echo "=== /var/tmp/bootstrap-salt.sh 下載完成==="

      echo "===Salt 安裝==="

      echo "Role: ${role}"

      if [ "${role}" = "master" ]; then

        echo "===安裝 Salt Master==="
        sh /var/tmp/bootstrap-salt.sh -M

      elif [ "${role}" = "minion" ]; then

          echo "===安裝 Salt Minion==="
          sh /var/tmp/bootstrap-salt.sh

      else
          echo "ERROR Role ${role}"
          exit 1

      fi

      echo "===Salt 安裝完成==="

      echo "===Salt 配置設置==="
 
       if [ "${role}" = "master" ]; then
          
          mkdir -p /etc/salt/master.d

          cp  /var/tmp/salt-bootstrap.conf /etc/salt/master.d/bootstrap.conf

          chmod 0644 /etc/salt/master.d/bootstrap.conf

          mkdir -p /srv/salt

          tar --extract --gzip \
            --file /var/tmp/salt-states.tar.gz \
            --directory /srv/salt

          chown -R root:root /srv/salt

          echo "Salt Master 配置完成."

          echo "=== Salt States 內容 ==="
          find /srv/salt -type f -print

      elif [ "${role}" = "minion" ]; then

          mkdir -p /etc/salt/minion.d

          cp /var/tmp/salt-bootstrap.conf /etc/salt/minion.d/bootstrap.conf

          chmod 0644 /etc/salt/minion.d/bootstrap.conf

          echo "Salt Minion 配置完成."

      fi

      echo "=== Salt 配置設置完成 ==="

      echo "=== Salt 服務啟動 ==="


      if [ "${role}" = "master" ]; then

        systemctl enable salt-master
        systemctl restart salt-master

        echo "Salt Master 服務已啟動."

      elif [ "${role}" = "minion" ]; then

        systemctl enable salt-minion
        systemctl restart salt-minion

        echo "Salt Minion 服務已啟動."

      fi