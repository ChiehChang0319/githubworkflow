name: CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/python

jobs:
  test:
    name: Code tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/python
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/python
        run: python -m pytest -v


  docker-test:
    name: Docker integration test
    runs-on: ubuntu-latest
    needs: test

    env:
      PYTHON_IMAGE: python-service:test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        working-directory: apps/python
        run: docker build -t python-service:test .

      # 根據docker compose的 nginx service, 另外啟一個臨時nginx容器, nginx -t 檢測nginx.conf
      - name: Validate Nginx config
        working-directory: deploy
        run: docker compose run --rm --no-deps nginx nginx -t

      - name: Run docker compose
        working-directory: deploy
        run: docker compose up -d

      - name: Show running containers
        working-directory: deploy
        run: docker compose ps
  
      - name: Wait for application
        working-directory: deploy
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:80/python/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become healthy"
          docker compose logs
          exit 1

      - name: Test health endpoint
        run: |
          response=$(curl --fail --silent --show-error http://localhost:80/python/health)

          echo "Response: $response"

          test "$response" = '{"status":"ok"}'


      - name: Show compose status
        if: failure()
        working-directory: deploy
        run: docker compose ps

      - name: Show compose logs
        if: failure()
        working-directory: deploy
        run: docker compose logs

      - name: Cleanup
        if: always()
        working-directory: deploy
        run: docker compose down -v


  build-and-push:
    name: Build and push production image
    runs-on: ubuntu-latest

    needs:
      - test
      - docker-test

    
    # Pull Requests 只跑上面 jobs 的 test 和 docker-test.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同時打包鏡像, tag為 Commit hash (SHA)和 latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max