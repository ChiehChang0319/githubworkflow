name: Terraform CI 

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yaml"

  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Disposable Plan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
      
      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      # GitHub OIDC token 簽發令牌獲取短期 AWS credentials 憑證, 去調用AWS API
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Terraform version
      - name: Terraform Version
        run: terraform version

      # Terraform format
      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff
      
      # Terraform Init (沒有remote backend, 使用默認 local backend)
      - name: Terraform Init
        run: terraform init
   
      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan (ㄧ次性 terraform plan 測試)      
      - name: Terraform Plan
        run: terraform plan